<head>

    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header class="cabecalho">
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="menu-hamburguer" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <nav class="cabecalho__navbar">
        <a class="cabecalho__logo-link" href="../index.html">
          <img src="../assents/logo.png" class="logo" alt="Logo EcoSoul">
        </a>

        <ul class="cabecalho__lista">
          <li class="cabecalho__list-item">
            <a class="cabecalho__link cabecalho__link--active" href="../index.html">Home</a>
          </li>
          <li class="cabecalho__list-item">
            <a class="cabecalho__link" href="./integrante.html">Integrantes</a>
          </li>
          <li class="cabecalho__list-item">
            <a class="cabecalho__link" href="./sobre.html">Sobre</a>
          </li>
          <li class="cabecalho__list-item">
            <a class="cabecalho__link" href="./faq.html">FAQ</a>

         <li class="cabecalho__list-item">
            <a class="cabecalho__link" href="./contato.html">Contato</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="contato-main">
        <form name="dados" action="contato.html" method="get">
          <fieldset>
            <legend>Formulário de Contato</legend>
            <label for="idNome">Nome:</label>
            <input id="idNome" type="text" name="nome" required><br>
            <label for="idEmail">E-mail:</label>
            <input id="idEmail" type="text" name="email" required><br>
            <label for="idTelefone">Telefone:</label>
            <input id="idTelefone" type="tel" name="telefone" required><br>
            <label for="mensagem">Como posso te ajudar*?</label><br>
            <textarea id="mensagem" name="mensagem" rows="7" cols="100" placeholder="Digite sua mensagem aqui..." required></textarea><br><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
          </fieldset>
        </form>
    </main>
    <footer>
        <p> 2026 Global Solution.&copy; Todos os direitos reservados.</p>
    </footer>
</body>
</html>
